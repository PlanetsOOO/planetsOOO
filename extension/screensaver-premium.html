<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit Premium Offline Tour</title>
    <link rel="stylesheet" href="screensaver.css" />
  </head>
  <body>
    <main class="space" aria-label="Orbit premium offline scenic tour">
      <div class="three-root" id="threeRoot" aria-hidden="true"></div>
      <div class="fade-overlay" id="fadeOverlay" aria-hidden="true"></div>
      <p class="offline-body-label" id="offlineBodyLabel" aria-live="polite"></p>
      <div class="offline-flight-hud" id="offlineFlightHud" aria-live="polite">
        <p id="offlineFlightHudHeading" hidden></p>
        <p id="offlineFlightHudValue">0 km/h</p>
      </div>
      <p class="offline-flight-message" id="offlineFlightMessage" aria-live="polite">
        FLIGHT MODE
      </p>
    </main>
    <script src="screensaver-premium.js"></script>
  </body>
</html>
