<!doctype html>
<html lang="en" class="screensaver-mode offline-react-mode">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#030508" />
    <title>Orbit Offline Explorer</title>
    <link rel="stylesheet" href="screensaver-react.css" />
    <link rel="stylesheet" href="screensaver.css" />
    <style>
      html,
      body {
        background: #030508;
      }

      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 42%, #0a1020 0%, #030508 68%);
      }
    </style>
  </head>
  <body class="screensaver-mode offline-react-mode">
    <div id="root" aria-label="Orbit offline explorer" aria-busy="true"></div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.childElementCount > 0) return;
        var message = event.message || "Script error";
        root.innerHTML =
          '<main style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#030508;color:#d4d4d8;padding:2rem;font-family:ui-monospace,Menlo,monospace;"><div style="max-width:28rem;text-align:center;"><p style="font-size:0.875rem;margin:0 0 0.75rem;">Orbit offline explorer failed to start</p><p style="font-size:0.75rem;color:#71717a;word-break:break-word;margin:0;">' +
          message +
          "</p></div></main>";
        root.removeAttribute("aria-busy");
      });
    </script>
    <script src="screensaver-react.js"></script>
  </body>
</html>
