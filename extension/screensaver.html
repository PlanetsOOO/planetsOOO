<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit Offline Scenic Tour</title>
    <link rel="stylesheet" href="screensaver.css" />
  </head>
  <body>
    <main class="space" aria-label="Orbit offline scenic tour">
      <div class="stars stars-a"></div>
      <div class="stars stars-b"></div>
      <div class="nebula"></div>

      <section class="scene" aria-live="polite">
        <p class="eyebrow">Offline Scenic Tour</p>
        <h1 id="focusName">Sun</h1>
        <p id="focusFact">Local fallback running from the Orbit extension.</p>
      </section>

      <section class="tour" aria-hidden="true">
        <div class="sunlight"></div>
        <div class="orbit-field" id="orbitField"></div>
        <div class="focus-wrap" id="focusWrap">
          <div class="focus-body" id="focusBody"></div>
          <div class="focus-ring" id="focusRing"></div>
        </div>
        <ol class="tour-rail" id="tourRail"></ol>
      </section>

      <p class="caption" id="upgradeStatus">Will upgrade to PlanetsOOO when internet returns</p>
      <p class="hint">Any input closes scenic mode · configured flight key shows online note</p>
    </main>
    <script src="screensaver.js"></script>
  </body>
</html>
