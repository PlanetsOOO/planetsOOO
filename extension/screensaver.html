<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit Screensaver</title>
    <link rel="stylesheet" href="screensaver.css" />
  </head>
  <body>
    <main class="space" aria-label="Orbit screensaver">
      <div class="stars stars-a"></div>
      <div class="stars stars-b"></div>
      <div class="nebula"></div>

      <section class="system" aria-hidden="true">
        <div class="orbit orbit-a">
          <span class="planet planet-a"></span>
        </div>
        <div class="orbit orbit-b">
          <span class="planet planet-b"></span>
        </div>
        <div class="orbit orbit-c">
          <span class="planet planet-c"></span>
        </div>
        <div class="sun"></div>
      </section>

      <p class="caption">Orbit Screensaver</p>
      <p class="hint">Right-click or press Escape to close</p>
    </main>
    <script src="screensaver.js"></script>
  </body>
</html>
